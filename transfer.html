<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
  <title>文件中转站 - Breeze</title>
  <link rel="stylesheet" href="./style/basic.css?v=1.2.0">
  <link rel="stylesheet" href="./style/common.css?v=1.2.0">
  <link rel="stylesheet" href="./style/pcstyle.css?v=1.2.0">
  <link rel="stylesheet" href="./style/pannlstyle.css?v=1.2.0">
  <link rel="stylesheet" href="./style/phonestyle.css?v=1.2.0">
  <link rel="stylesheet" href="./style/transfer.css?v=1.2.0">
</head>
<body>
  <main class="transfer-page">
    <div class="transfer-box blur">
      <div class="header">
        <h2>📁 文件中转站</h2>
        <a href="javascript:window.close();" class="back-btn">关闭页面</a>
      </div>
      
      <div class="upload-section">
        <div class="file-input-wrapper">
          <input type="file" id="file-input" class="file-input">
          <label for="file-input" class="file-label">选择要上传的文件</label>
          <span id="file-name-display">未选择任何文件</span>
        </div>
        <button id="upload-btn" class="upload-btn">开始上传</button>
        <p id="upload-status" class="status-msg"></p>

        <div id="progress-container" class="progress-container hidden">
          <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div id="progress-text">0%</div>
        </div>
      </div>

      <div class="list-section">
        <h3>⬇️ 云端文件列表</h3>
        <ul id="file-list">
          <li>加载中...</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="./js/transfer.js?v=1.2.0" type="module"></script>
</body>
</html>
