<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
  <meta name="keywords" content="Breeze">
  <meta name="description"
    content="自用的个人主页">
  <meta name="author" content="Breeze">
  <link rel="stylesheet" href="./style/basic.css?v=2.0.0">
  <link rel="stylesheet" href="./style/common.css?v=2.0.0">
  <link rel="stylesheet" href="./style/pcstyle.css?v=2.0.0">
  <link rel="stylesheet" href="./style/pannlstyle.css?v=2.0.0">
  <link rel="stylesheet" href="./style/phonestyle.css?v=2.0.0">
  <title>Breeze</title>
</head>

<body>
  <header>
  </header>
  <main>
    <section>
      <div class="logo">
        <h1><a href="https://breeze.qzz.io">Xiao He</a></h1>
      </div>
      <div class="blur message">
        <p>人生南北多歧路<p>
      </div>
      <div class="social">
        <div class="links">
          <a href="https://github.com/Breeze1733" target="_blank"><img src="./images/github.png" alt="github"></a>
          <a href="./images/qq.png" target="_blank"><img src="./images/qqicon.png" alt="QQ"></a>
          <a href="./images/wechat.png" target="_blank"><img src="./images/wechaticon.png" alt="wechat"></a>
          <a href="./blog.html" target="_blank"><img src="./images/blog.png" alt="blog"></a>
        </div>
        <div class="tip"></div>
      </div>
      <div class="menu blur">
        <img src="./images/list.png" alt="list">
      </div>
    </section>
    <section>
      <div class="top">
        <div class="blur music phoneStyle">
          <audio src="./audio/十七岁 - 刘德华.mp3"></audio>
          <h3>十七岁 - 刘德华</h3>
          <div class="player">
            <span class="left">
              <img src="./images/shangyishou.png" alt="上一首">
            </span>
            <span class="pause hidden">
              <img src="./images/pause.png" alt="暂停">
            </span>
            <span class="start">
              <img src="./images/start.png" alt="播放">
            </span>
            <span class="right">
              <img src="./images/xiayishou.png" alt="下一首">
            </span>
          </div>
          <div class="song-info">
            <span>列表</span>
            <div class="sound">
              <img src="./images/sound.png" alt="声音">
              <div class="slider">
                <div class="fullSlider"></div>
                <div class="dot"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="blur timer">
          <div class="data">
            <span>0000年</span>
            <span>00月</span>
            <span>00日</span>
          </div>
          <div class="time">
            00:00:00
          </div>
          <div class="location">
            <span>火星市</span>
            <span>炎热</span>
            <span>666 ℃</span>
          </div>
        </div>
      </div>
      <div class="bottom">
        <h2>工作区</h2>
        <div class="netlink">
          <ul>
            <li class="blur">
              <a href="./transfer.html?v=2.0.0" target="_blank">
                <img src="./images/transfer.png" alt="文件中转站">
                <span>文件中转站</span>
              </a>
            </li>
            <li class="blur">
              <a href="./clipboard.html?v=2.0.0" target="_blank">
                <img src="./images/clipboard.png" alt="云剪切板">
                <span>云剪切板</span>
              </a>
            </li>
            <li class="blur">
              <a href="#" target="_blank">
                <img src="./images/mores.png" alt="敬请期待">
                <span>敬请期待</span>
              </a>
            </li>
          </ul>
          <ul>
            <li class="blur">
              <a href="#" target="_blank">
                <img src="./images/mores.png" alt="敬请期待">
                <span>敬请期待</span>
              </a>
            </li>
            <li class="blur">
              <a href="#" target="_blank" >
                <img src="./images/mores.png" alt="敬请期待">
                <span>敬请期待</span>
              </a>
            </li>
            <li class="blur">
              <a href="#">
                <img src="./images/mores.png" alt="敬请期待">
                <span>敬请期待</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="menu blur menuquit">
        <img src="./images/quit.png" alt="home">
      </div>
    </section>
  </main>
  <footer>
    <small>已运行 00 天</small>
  </footer>
  <script src="./js/basic.js?v=2.0.0" type="module"></script>
</body>

</html>
